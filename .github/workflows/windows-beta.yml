name: Windows portable beta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s tests -p test_windows_support.py
      - run: python -m unittest discover -s tests -p test_request_faults.py
      - run: python -m unittest discover -s tests -p test_location_special.py
      - run: python -m unittest discover -s tests -p test_resource_limits.py
      - run: python scripts/build_windows.py
      - run: python scripts/smoke_package.py dist/BackedUp/BackedUp.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BackedUp-Windows-x64-beta
          path: |
            release/*Windows-x64.zip
            release/windows-manifest.json
          if-no-files-found: error
